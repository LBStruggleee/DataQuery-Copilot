name: Build and Smoke Test

on:
  push:
  pull_request:

# P2-45：同一分支/PR 只保留最新一次运行，旧 run 自动取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Prepare demo database
        run: python scripts/prepare_demo_db.py
      # P1-13：全量后端测试进 CI（含鉴权/契约/数据层，不再只跑冒烟子集）
      - name: Run full backend test suite
        run: python -m pytest tests/ -q

  # P1-17：后端 lint 与类型检查。非阻塞（continue-on-error），
  # 首次接入先暴露存量问题，不挡合流；后续可移除该开关收紧。
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint/type dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint (non-blocking)
        run: ruff check api src scripts tests
      # P1-17 收尾：后端类型检查门禁（存量 11 处标注问题，见 pyproject [tool.mypy] 注释）
      - name: Mypy type check (non-blocking)
        run: mypy api src

  # P1-17 收尾：前端 vitest 单测门禁——此前前端测试只存在于本地，CI 完全不执行
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run frontend unit tests (vitest)
        run: npm test

  # P1-17 收尾：Playwright e2e 真实链路进 CI（P1-15 已交付 bash 入口与 Key 注入，
  # e2e_up.sh 自动准备隔离库 → 签发测试 Key → 拉起后端/前端跑全部用例）
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Prepare demo database
        run: python scripts/prepare_demo_db.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run Playwright e2e (real backend link)
        run: bash scripts/e2e_up.sh

  # P1-17 收尾：依赖安全审计（pip-audit 实测 0 漏洞、npm audit --omit=dev 实测 0 漏洞，
  # 故作为阻塞门禁；后续出现新 advisory 时升级依赖版本即可）
  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: pip-audit on requirements
        run: pip-audit -r requirements.txt -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev
        working-directory: frontend

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  secret-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No tracked .env files
        # 收尾修复第2轮：白名单排除 *.example——原正则 `(^|/)\.env(\.|$)` 会命中
        # 被跟踪的模板文件 .env.example / frontend/.env.example（/.env 后跟 .example
        # 的点），导致本门禁在 HEAD 恒 exit 1；现仅拦截真实 env 文件（.env/.env.local 等）
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v -E '\.example$' || true)
          if [ -n "$tracked" ]; then echo "tracked env files: $tracked"; exit 1; fi
          echo "no tracked .env"
      - name: No plaintext secrets in source
        run: |
          hits=$(grep -rn -E 'sk-[A-Za-z0-9]{20,}|dqc_[A-Za-z0-9_-]{16,}' --include='*.py' --include='*.ts' --include='*.tsx' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.md' --include='*.ps1' --include='*.sh' api src scripts load frontend docs render.yaml || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi
          echo "no plaintext secrets"
