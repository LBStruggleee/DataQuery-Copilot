name: Build and Smoke Test

on:
  push:
  pull_request:

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Prepare demo database
        run: python scripts/prepare_demo_db.py
      - name: Run API and visualization smoke tests
        run: python -m pytest tests/test_api.py tests/test_visualizer.py -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
