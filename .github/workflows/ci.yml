name: Build and Smoke Test

on:
  push:
  pull_request:

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Prepare demo database
        run: python scripts/prepare_demo_db.py
      - name: Run API and visualization smoke tests
        run: python -m pytest tests/test_api.py tests/test_visualizer.py -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  secret-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No tracked .env files
        run: |
          tracked=$(git ls-files | grep -x -e '.env' -e '*/.env' || true)
          if [ -n "$tracked" ]; then echo "tracked env files: $tracked"; exit 1; fi
          echo "no tracked .env"
      - name: No plaintext secrets in source
        run: |
          hits=$(grep -rn -E 'sk-[A-Za-z0-9]{20,}|dqc_[A-Za-z0-9_-]{16,}' --include='*.py' --include='*.ts' --include='*.tsx' api src scripts load frontend/src || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi
          echo "no plaintext secrets"
