[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataquery-copilot"
version = "0.1.0"
description = "An LLM-powered natural-language interface for querying local data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "matplotlib>=3.7.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
dataquery-copilot = "src.cli:main"

[tool.setuptools]
packages = ["api", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
