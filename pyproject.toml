[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataquery-copilot"
version = "0.1.0"
description = "An LLM-powered natural-language interface for querying local data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.18",
    "matplotlib>=3.7.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    # pytest>=9.0.3：修复 PYSEC-2026-1845（与 requirements-dev.txt 同步）
    "pytest>=9.0.3,<10.0.0",
]

[project.scripts]
dataquery-copilot = "src.cli:main"

[tool.setuptools]
packages = ["api", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# P1-17 收尾：首次接入 mypy（CI 中暂为非阻塞）。存量代码标注不全，
# 先以默认严格度报告真实类型问题；三方库桩缺失统一忽略，避免噪音淹没信号。
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

